name: Build, push and deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    IMAGE: ghcr.io/vlad-kozak/ua-sun-tg-bot
    # Тека на проді: тут лежать .env і data/.
    DEPLOY_DIR: /app/ua-sun-tg-bot

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set version
              id: version
              run: echo "version=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: ./
                  push: true
                  tags: |
                      ${{ env.IMAGE }}:latest
                      ${{ env.IMAGE }}:v${{ steps.version.outputs.version }}

    deploy:
        needs: build-and-push
        runs-on: [self-hosted, prod]
        permissions:
            contents: read
            packages: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # .env і data/ на сервері живуть поза репозиторієм, тому з чекауту
            # їде лише compose-файл — інакше зміни в ньому не доїжджають на прод.
            - name: Sync compose file
              run: |
                  test -d "$DEPLOY_DIR" || { echo "::error::Немає теки $DEPLOY_DIR"; exit 1; }
                  test -f "$DEPLOY_DIR/.env" || { echo "::error::Немає $DEPLOY_DIR/.env"; exit 1; }
                  install -m 644 docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"

            - name: Restart docker compose
              working-directory: ${{ env.DEPLOY_DIR }}
              run: |
                  docker compose pull
                  docker compose up -d --remove-orphans
