# Фіксоване ім'я проєкту: не залежить від назви теки на сервері й не дає
# випадково підняти другу копію бота з того самого коду.
name: ua-sun-tg-bot

services:
  bot:
    # Прод тягне готовий образ із GHCR (.github/workflows/deploy.yml),
    # локально той самий тег збирається через `docker compose up -d --build`.
    # IMAGE_TAG дозволяє відкотитись на конкретну версію: IMAGE_TAG=v42.
    image: ghcr.io/vlad-kozak/ua-sun-tg-bot:${IMAGE_TAG:-latest}
    build: .
    container_name: ua-sun-tg-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Шлях усередині контейнера; ./data з хоста монтується сюди.
      DATABASE_URL: sqlite+aiosqlite:///data/bot.db
    volumes:
      - ./data:/app/data
    # Показує різницю між «процес живий» і «апдейти обробляються».
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
